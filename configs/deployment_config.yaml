# Precision Agriculture Platform - Deployment Configuration

# Application Configuration
app:
  name: "precision_agriculture_platform"
  version: "1.0.0"
  description: "AI-powered crop health monitoring system"
  
# API Configuration
api:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  timeout: 300
  
  cors:
    enabled: true
    origins: ["*"]
    methods: ["GET", "POST", "PUT", "DELETE"]
  
  rate_limiting:
    enabled: true
    requests_per_minute: 60

# Database Configuration
database:
  type: "postgresql"  # postgresql, mongodb, sqlite
  host: "localhost"
  port: 5432
  name: "precision_agriculture"
  user: "postgres"
  password: "${DB_PASSWORD}"
  
  connection_pool:
    min_size: 5
    max_size: 20

# Redis Configuration (for caching and queues)
redis:
  host: "localhost"
  port: 6379
  db: 0
  password: "${REDIS_PASSWORD}"
  
  cache:
    ttl: 3600  # 1 hour
    max_memory: "256mb"

# Model Serving
model_serving:
  model_path: "/workspace/models/best_model.pth"
  batch_size: 16
  max_sequence_length: 24
  
  preprocessing:
    normalize: true
    cache_features: true
  
  postprocessing:
    confidence_threshold: 0.7
    return_probabilities: true

# File Storage
storage:
  type: "local"  # local, s3, gcs, azure
  base_path: "/workspace/data"
  
  s3:  # if type is s3
    bucket: "precision-agriculture-data"
    region: "us-west-2"
    access_key: "${AWS_ACCESS_KEY}"
    secret_key: "${AWS_SECRET_KEY}"

# Monitoring and Logging
monitoring:
  enabled: true
  
  metrics:
    - request_count
    - response_time
    - error_rate
    - model_accuracy
    - system_resources
  
  alerts:
    email: ["admin@farm.com"]
    slack_webhook: "${SLACK_WEBHOOK_URL}"
    
    thresholds:
      error_rate: 0.05
      response_time: 2000  # ms
      cpu_usage: 0.8
      memory_usage: 0.8

# Security
security:
  authentication:
    enabled: true
    method: "jwt"  # jwt, oauth2, api_key
    secret_key: "${JWT_SECRET_KEY}"
    token_expiry: 3600  # seconds
  
  authorization:
    roles:
      - admin
      - farmer
      - researcher
      - viewer
  
  encryption:
    enabled: true
    algorithm: "AES-256"

# Docker Configuration
docker:
  base_image: "python:3.9-slim"
  
  build:
    context: "."
    dockerfile: "docker/Dockerfile"
    target: "production"
  
  resources:
    cpu_limit: "2"
    memory_limit: "4Gi"
    cpu_request: "1"
    memory_request: "2Gi"

# Kubernetes Configuration
kubernetes:
  namespace: "precision-agriculture"
  
  deployment:
    replicas: 3
    strategy: "RollingUpdate"
    
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2"
        memory: "4Gi"
  
  service:
    type: "LoadBalancer"
    port: 80
    target_port: 8000
  
  ingress:
    enabled: true
    host: "api.precision-agriculture.com"
    tls: true

# Edge Deployment
edge:
  enabled: true
  
  devices:
    - type: "nvidia_jetson"
      model_optimization: "tensorrt"
      batch_size: 4
    - type: "raspberry_pi"
      model_optimization: "quantization"
      batch_size: 1
  
  sync:
    frequency: "daily"
    compression: true

# Dashboard Configuration
dashboard:
  enabled: true
  host: "0.0.0.0"
  port: 3000
  
  features:
    - real_time_monitoring
    - historical_analysis
    - alert_management
    - user_management
    - report_generation
  
  maps:
    provider: "mapbox"  # mapbox, google, osm
    api_key: "${MAPBOX_API_KEY}"
    
  charts:
    library: "plotly"  # plotly, d3, chartjs
    
# Mobile App Configuration
mobile:
  push_notifications:
    enabled: true
    provider: "firebase"  # firebase, apns, fcm
    api_key: "${FIREBASE_API_KEY}"
  
  offline_mode:
    enabled: true
    cache_size: "100mb"

# Integration Configuration
integrations:
  weather_api:
    provider: "openweather"
    api_key: "${WEATHER_API_KEY}"
    update_frequency: "hourly"
  
  farm_management:
    - type: "farmworks"
      api_endpoint: "${FARMWORKS_API}"
      credentials: "${FARMWORKS_CREDS}"
    - type: "agrivi"
      api_endpoint: "${AGRIVI_API}"
      credentials: "${AGRIVI_CREDS}"
  
  satellite_data:
    provider: "sentinel_hub"
    api_key: "${SENTINEL_HUB_KEY}"
    
# Backup and Recovery
backup:
  enabled: true
  frequency: "daily"
  retention: 30  # days
  
  destinations:
    - type: "s3"
      bucket: "precision-agriculture-backups"
    - type: "local"
      path: "/backup"

# Performance Optimization
performance:
  caching:
    enabled: true
    levels:
      - application
      - database
      - cdn
  
  cdn:
    provider: "cloudflare"
    api_key: "${CLOUDFLARE_API_KEY}"
  
  compression:
    enabled: true
    algorithms: ["gzip", "brotli"]
  
  load_balancing:
    algorithm: "round_robin"
    health_check: "/health"