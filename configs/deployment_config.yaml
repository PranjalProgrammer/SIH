# Deployment Configuration for Precision Agriculture Platform

environment: "production"  # development, staging, production

api:
  host: "0.0.0.0"
  port: 5000
  workers: 4
  timeout: 30
  keepalive: 2
  max_requests: 1000
  
dashboard:
  host: "0.0.0.0"
  port: 8080
  debug: false
  
database:
  postgres:
    host: "postgres"
    port: 5432
    database: "precision_agriculture"
    username: "agri_user"
    password: "agri_password"
    pool_size: 10
    
  influxdb:
    host: "influxdb"
    port: 8086
    database: "sensor_data"
    username: "sensor_user"
    password: "sensor_password"
    
cache:
  redis:
    host: "redis"
    port: 6379
    db: 0
    ttl: 3600
    max_connections: 20
    
mqtt:
  broker:
    host: "mosquitto"
    port: 1883
    keepalive: 60
    
  topics:
    sensor_data: "agriculture/sensors/+/data"
    alerts: "agriculture/alerts"
    predictions: "agriculture/predictions"
    
storage:
  data_path: "/app/data"
  model_path: "/app/models"
  upload_path: "/app/uploads"
  log_path: "/app/logs"
  
  max_upload_size: "100MB"
  allowed_extensions:
    - "jpg"
    - "jpeg"
    - "png"
    - "tiff"
    - "tif"
    - "csv"
    - "json"
    
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  handlers:
    file:
      enabled: true
      filename: "/app/logs/platform.log"
      max_bytes: 10485760  # 10MB
      backup_count: 5
      
    console:
      enabled: true
      
monitoring:
  health_check:
    enabled: true
    interval: 30  # seconds
    
  metrics:
    enabled: true
    port: 9090
    
  alerts:
    email:
      enabled: false
      smtp_server: "smtp.gmail.com"
      smtp_port: 587
      username: ""
      password: ""
      recipients: []
      
    slack:
      enabled: false
      webhook_url: ""
      channel: "#agriculture-alerts"
      
security:
  cors:
    enabled: true
    origins: ["*"]
    methods: ["GET", "POST", "PUT", "DELETE"]
    headers: ["Content-Type", "Authorization"]
    
  rate_limiting:
    enabled: true
    requests_per_minute: 60
    
  authentication:
    enabled: false
    jwt_secret: "your-secret-key"
    token_expiry: 3600  # seconds
    
performance:
  model_caching:
    enabled: true
    max_models_in_memory: 5
    
  request_batching:
    enabled: true
    max_batch_size: 8
    max_wait_time: 0.1
    
  compression:
    enabled: true
    threshold: 1024  # bytes
    
backup:
  enabled: true
  schedule: "0 2 * * *"  # Daily at 2 AM
  retention_days: 30
  
  s3:
    enabled: false
    bucket: ""
    access_key: ""
    secret_key: ""
    region: "us-east-1"
    
scaling:
  auto_scaling:
    enabled: false
    min_replicas: 1
    max_replicas: 10
    target_cpu_percentage: 70
    
  load_balancer:
    enabled: false
    algorithm: "round_robin"  # round_robin, least_connections, ip_hash